<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gallery · 2114112</title>
<link rel="stylesheet" href="stil.css">
</head>
<body>

<nav class="pfad"><a href="/">current</a><span>/</span>gallery</nav>

<main class="serien" id="serien"></main>

<script>
fetch("serien.json").then(function (r) { return r.json(); }).then(function (serien) {
  var main = document.getElementById("serien");
  serien.forEach(function (s) {
    var erstes = typeof s.werke[0] === "string" ? s.werke[0] : s.werke[0].id;
    var a = document.createElement("a");
    a.href = "serie.html?s=" + s.id;
    a.innerHTML =
      '<div class="deckel"><img src="serien/' + s.id + '/klein/' + erstes + '.jpg" alt=""></div>' +
      '<div class="titel"><span></span></div>';
    a.querySelector(".titel span").textContent = s.titel;
    main.appendChild(a);
  });
});
</script>
<script src="/bg.js"></script>
</body>
</html>
