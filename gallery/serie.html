<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gallery · 2114112</title>
<link rel="stylesheet" href="stil.css">
</head>
<body>

<nav class="pfad"><a href="/">current</a><span>/</span><a href="./">gallery</a><span>/</span><span id="pfadname" style="opacity:1"></span></nav>

<h1 id="titel"></h1>
<div class="meta" id="meta"></div>

<main class="raster" id="raster"></main>

<div class="betrachter" id="betrachter" role="dialog" aria-modal="true" aria-label="werk">
  <img id="gross" alt="">
</div>
<div class="leiste" id="leiste" hidden>
  <span id="name"></span>
  <span class="stufen" id="stufen"></span>
  <span>
    <button id="zurueck" aria-label="vorheriges werk">⟲</button>
    <button id="weiter" aria-label="nächstes werk">⟳</button>
  </span>
  <button class="zu" id="zu" aria-label="schließen">×</button>
</div>

<script>
(function () {
  var STUFEN = [1, 2, 4, 8, 12];
  var id = new URLSearchParams(location.search).get("s");
  var werke = [], serie, index = 0;

  var betr = document.getElementById("betrachter");
  var bild = document.getElementById("gross");
  var leiste = document.getElementById("leiste");
  var stufenEl = document.getElementById("stufen");

  // zustand: grundmaß (bild passt in fenster) * zoom, verschiebung
  var basis = 1, zoom = 1, tx = 0, ty = 0;

  function anwenden() {
    var s = basis * zoom;
    bild.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + s + ")";
    stufenEl.querySelectorAll("button").forEach(function (b) {
      b.classList.toggle("an", Number(b.dataset.z) === zoom);
    });
  }

  function begrenzen() {
    var s = basis * zoom;
    var w = bild.naturalWidth * s, h = bild.naturalHeight * s;
    var vw = innerWidth, vh = innerHeight;
    // bild-ecke relativ zur fenstermitte
    var minX = w > vw ? vw / 2 - w : -w / 2, maxX = w > vw ? -vw / 2 : -w / 2;
    var minY = h > vh ? vh / 2 - h : -h / 2, maxY = h > vh ? -vh / 2 : -h / 2;
    tx = Math.min(maxX, Math.max(minX, tx));
    ty = Math.min(maxY, Math.max(minY, ty));
  }

  function zoomen(neu, px, py) {
    // px, py: bildschirmpunkt, der fix bleiben soll
    if (px === undefined) { px = innerWidth / 2; py = innerHeight / 2; }
    var mx = px - innerWidth / 2, my = py - innerHeight / 2;
    var alt = basis * zoom, n = basis * neu;
    tx = mx - (mx - tx) * n / alt;
    ty = my - (my - ty) * n / alt;
    zoom = neu;
    begrenzen(); anwenden();
  }

  function einpassen() {
    basis = Math.min((innerWidth - 48) / bild.naturalWidth, (innerHeight - 96) / bild.naturalHeight);
    zoom = 1;
    tx = -bild.naturalWidth * basis / 2;
    ty = -bild.naturalHeight * basis / 2;
    anwenden();
  }

  function zeigen(i) {
    index = (i + werke.length) % werke.length;
    var w = werke[index];
    document.getElementById("name").textContent = w.name + "  " + (index + 1) + "/" + werke.length;
    bild.onload = einpassen;
    bild.src = "serien/" + id + "/" + w.id + ".jpg";
    bild.alt = w.name;
    var g = new Image();
    g.onload = function () {
      if (werke[index] !== w) return;
      if (!bild.complete || !bild.naturalWidth) { bild.onload = einpassen; bild.src = g.src; return; }
      var faktor = bild.naturalWidth / g.naturalWidth;
      bild.onload = function () { basis = basis * faktor; anwenden(); };
      bild.src = g.src;
    };
    g.src = "serien/" + id + "/gross/" + w.id + ".jpg";
  }

  // leiste blendet bei ruhe aus
  var ruhe = null;
  function wach() {
    leiste.classList.remove("still");
    clearTimeout(ruhe);
    ruhe = setTimeout(function () { leiste.classList.add("still"); }, 1800);
  }
  ["pointermove", "wheel", "keydown", "pointerdown"].forEach(function (ev) {
    addEventListener(ev, function () { if (betr.classList.contains("offen")) wach(); }, { passive: true });
  });

  function oeffnen(i) {
    betr.classList.add("offen"); leiste.hidden = false;
    document.body.style.overflow = "hidden";
    zeigen(i);
    wach();
  }
  function schliessen() {
    betr.classList.remove("offen"); leiste.hidden = true;
    document.body.style.overflow = "";
    bild.removeAttribute("src");
  }

  STUFEN.forEach(function (z) {
    var b = document.createElement("button");
    b.textContent = "×" + z; b.dataset.z = z;
    b.addEventListener("click", function () { zoomen(z); });
    stufenEl.appendChild(b);
  });

  document.getElementById("zu").onclick = schliessen;
  document.getElementById("weiter").onclick = function () { zeigen(index + 1); };
  document.getElementById("zurueck").onclick = function () { zeigen(index - 1); };

  addEventListener("keydown", function (e) {
    if (!betr.classList.contains("offen")) return;
    if (e.key === "Escape") schliessen();
    if (e.key === "ArrowRight") zeigen(index + 1);
    if (e.key === "ArrowLeft") zeigen(index - 1);
    if (e.key === "+" ) zoomen(STUFEN[Math.min(STUFEN.length - 1, STUFEN.indexOf(zoom) + 1)]);
    if (e.key === "-" ) zoomen(STUFEN[Math.max(0, STUFEN.indexOf(zoom) - 1)]);
  });

  // mausrad: stufenweise zum mauspunkt
  betr.addEventListener("wheel", function (e) {
    e.preventDefault();
    var i = STUFEN.indexOf(zoom) + (e.deltaY < 0 ? 1 : -1);
    i = Math.max(0, Math.min(STUFEN.length - 1, i));
    if (STUFEN[i] !== zoom) zoomen(STUFEN[i], e.clientX, e.clientY);
  }, { passive: false });

  // doppelklick: eine stufe hinein, auf höchster stufe zurück
  betr.addEventListener("dblclick", function (e) {
    var i = STUFEN.indexOf(zoom);
    zoomen(i === STUFEN.length - 1 ? 1 : STUFEN[i + 1], e.clientX, e.clientY);
  });

  // ziehen & zwei-finger-zoom
  var zeiger = new Map(), start = null, bewegt = false;
  betr.addEventListener("pointerdown", function (e) {
    betr.setPointerCapture(e.pointerId);
    zeiger.set(e.pointerId, { x: e.clientX, y: e.clientY });
    bewegt = false;
    if (zeiger.size === 1) { start = { x: e.clientX, y: e.clientY, tx: tx, ty: ty }; betr.classList.add("ziehen"); }
    if (zeiger.size === 2) {
      var p = Array.from(zeiger.values());
      start = { d: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), z: zoom };
    }
  });
  betr.addEventListener("pointermove", function (e) {
    if (!zeiger.has(e.pointerId)) return;
    zeiger.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (zeiger.size === 1 && start && start.tx !== undefined) {
      var dx = e.clientX - start.x, dy = e.clientY - start.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) bewegt = true;
      tx = start.tx + dx; ty = start.ty + dy;
      begrenzen(); anwenden();
    } else if (zeiger.size === 2 && start && start.d) {
      var p = Array.from(zeiger.values());
      var d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      var ziel = start.z * d / start.d;
      var naechste = STUFEN.reduce(function (a, b) { return Math.abs(b - ziel) < Math.abs(a - ziel) ? b : a; });
      if (naechste !== zoom) zoomen(naechste, (p[0].x + p[1].x) / 2, (p[0].y + p[1].y) / 2);
      bewegt = true;
    }
  });
  function los(e) {
    zeiger.delete(e.pointerId);
    betr.classList.remove("ziehen");
    if (zeiger.size === 1) {
      var p = Array.from(zeiger.values())[0];
      start = { x: p.x, y: p.y, tx: tx, ty: ty };
    } else if (zeiger.size === 0) {
      // klick ins leere schließt, wenn nicht gezogen und ganz herausgezoomt
      if (!bewegt && zoom === 1 && e.target === betr) schliessen();
      start = null;
    }
  }
  betr.addEventListener("pointerup", los);
  betr.addEventListener("pointercancel", los);
  addEventListener("resize", function () { if (betr.classList.contains("offen") && bild.naturalWidth) einpassen(); });

  fetch("serien.json").then(function (r) { return r.json(); }).then(function (alle) {
    serie = alle.filter(function (s) { return s.id === id; })[0] || alle[0];
    id = serie.id;
    document.title = serie.titel + " · 2114112";
    document.getElementById("pfadname").textContent = serie.titel;
    document.getElementById("titel").textContent = serie.titel;
    var meta = document.getElementById("meta");
    meta.textContent = [serie.jahr, serie.werke.length + " arbeiten"].filter(Boolean).join(" · ");
    if (serie.link) {
      var a = document.createElement("a");
      a.href = serie.link; a.target = "_blank"; a.rel = "noopener"; a.textContent = "↗";
      meta.append("  ", a);
    }
    if (serie.notiz) { var n = document.createElement("p"); n.textContent = serie.notiz; meta.appendChild(n); }

    var raster = document.getElementById("raster");
    serie.werke.forEach(function (e, i) {
      var w = typeof e === "string" ? { id: e, name: e } : { id: e.id, name: e.titel || e.id };
      werke.push(w);
      var b = document.createElement("button");
      b.innerHTML = '<div class="bild"><img loading="lazy" alt=""></div><small><span></span><span>' + (i + 1) + '</span></small>';
      b.querySelector("img").src = "serien/" + id + "/klein/" + w.id + ".jpg";
      b.querySelector("img").alt = w.name;
      b.querySelector("small span").textContent = w.name;
      b.addEventListener("click", function () { oeffnen(i); });
      raster.appendChild(b);
    });
  });
})();
</script>
<script src="/bg.js"></script>
</body>
</html>
