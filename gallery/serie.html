<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gallery · 2114112</title>
<link rel="stylesheet" href="stil.css">
</head>
<body>

<nav class="pfad"><a href="/">current</a><span>/</span><a href="./">gallery</a><span>/</span><span id="pfadname" style="opacity:1"></span></nav>

<h1 id="titel"></h1>
<div class="meta" id="meta"></div>

<main class="raster" id="raster"></main>

<div class="betrachter" id="betrachter" role="dialog" aria-modal="true" aria-label="werk">
  <img id="gross" alt="">
</div>
<div class="leiste" id="leiste" hidden>
  <span id="name"></span>
  <span>
    <button id="zurueck" aria-label="vorheriges werk">⟲</button>
    <button id="weiter" aria-label="nächstes werk">⟳</button>
  </span>
  <button class="zu" id="zu" aria-label="schließen">×</button>
</div>

<script>
(function () {
  var MIN = 1, MAX = 12;
  var id = new URLSearchParams(location.search).get("s");
  var werke = [], serie, index = 0, endung = "jpg";

  var betr = document.getElementById("betrachter");
  var bild = document.getElementById("gross");
  var leiste = document.getElementById("leiste");

  // basis: maß, bei dem das bild ins fenster passt
  // aktuell (z, x, y) gleitet weich zum ziel (zz, zx, zy)
  var basis = 1;
  var z = 1, x = 0, y = 0;
  var zz = 1, zx = 0, zy = 0;
  var laeuft = false;

  function grenzen(zoom, px, py) {
    var s = basis * zoom;
    var w = bild.naturalWidth * s, h = bild.naturalHeight * s;
    var vw = innerWidth, vh = innerHeight;
    var minX = w > vw ? vw / 2 - w : -w / 2, maxX = w > vw ? -vw / 2 : -w / 2;
    var minY = h > vh ? vh / 2 - h : -h / 2, maxY = h > vh ? -vh / 2 : -h / 2;
    return [Math.min(maxX, Math.max(minX, px)), Math.min(maxY, Math.max(minY, py))];
  }

  function zeichnen() {
    bild.style.transform = "translate(" + x + "px," + y + "px) scale(" + (basis * z) + ")";
  }

  var zuletzt = 0;
  function schritt(t) {
    var dt = zuletzt ? Math.min(64, t - zuletzt) : 16;
    zuletzt = t;
    var k = 1 - Math.exp(-dt / 90);
    z += (zz - z) * k; x += (zx - x) * k; y += (zy - y) * k;
    var fertig = Math.abs(zz - z) < 0.0005 && Math.abs(zx - x) < 0.1 && Math.abs(zy - y) < 0.1;
    if (fertig) { z = zz; x = zx; y = zy; }
    zeichnen();
    if (!fertig) requestAnimationFrame(schritt); else { laeuft = false; zuletzt = 0; }
  }
  function animieren() { if (!laeuft) { laeuft = true; requestAnimationFrame(schritt); } }

  // ziel-zoom um einen bildschirmpunkt
  function zielZoom(neu, px, py) {
    neu = Math.max(MIN, Math.min(MAX, neu));
    var mx = px - innerWidth / 2, my = py - innerHeight / 2;
    var nx = mx - (mx - zx) * neu / zz, ny = my - (my - zy) * neu / zz;
    var g = grenzen(neu, nx, ny);
    zz = neu; zx = g[0]; zy = g[1];
    animieren();
  }

  // maus führt durchs bild: mausposition im fenster = position im bild
  var maus = null;
  function folgen(px, py) {
    var s = basis * zz;
    var w = bild.naturalWidth * s, h = bild.naturalHeight * s;
    var vw = innerWidth, vh = innerHeight, rand = 0.08;
    var fx = Math.min(1, Math.max(0, (px / vw - rand) / (1 - 2 * rand)));
    var fy = Math.min(1, Math.max(0, (py / vh - rand) / (1 - 2 * rand)));
    zx = w > vw ? -(w - vw) * fx - vw / 2 : -w / 2;
    zy = h > vh ? -(h - vh) * fy - vh / 2 : -h / 2;
    animieren();
  }

  // sofort setzen (beim ziehen)
  function sofort(nz, nx, ny) {
    nz = Math.max(MIN, Math.min(MAX, nz));
    var g = grenzen(nz, nx, ny);
    z = zz = nz; x = zx = g[0]; y = zy = g[1];
    zeichnen();
  }

  function einpassen() {
    basis = Math.min((innerWidth - 48) / bild.naturalWidth, (innerHeight - 96) / bild.naturalHeight);
    sofort(1, -bild.naturalWidth * basis / 2, -bild.naturalHeight * basis / 2);
  }

  function zeigen(i) {
    index = (i + werke.length) % werke.length;
    var w = werke[index];
    var nameEl = document.getElementById("name");
    nameEl.style.opacity = 0;
    bild.style.opacity = 0;
    var laden = function () {
      bild.onload = function () {
        einpassen();
        requestAnimationFrame(function () { bild.style.opacity = 1; nameEl.textContent = w.name; nameEl.style.opacity = 1; });
      };
      bild.src = "serien/" + id + "/" + w.id + "." + endung;
    };
    if (bild.getAttribute("src")) setTimeout(laden, 280); else laden();
    bild.alt = w.name || serie.titel;
    if (serie.gross === false) return;
    var g = new Image();
    g.onload = function () {
      if (werke[index] !== w) return;
      if (!bild.complete || !bild.naturalWidth) { bild.onload = function () { einpassen(); bild.style.opacity = 1; }; bild.src = g.src; return; }
      var faktor = bild.naturalWidth / g.naturalWidth;
      bild.onload = function () { basis = basis * faktor; zeichnen(); };
      bild.src = g.src;
    };
    g.src = "serien/" + id + "/gross/" + w.id + ".jpg";
  }

  var ruhe = null;
  function wach() {
    leiste.classList.remove("still");
    clearTimeout(ruhe);
    ruhe = setTimeout(function () { leiste.classList.add("still"); }, 1800);
  }
  ["pointermove", "wheel", "keydown", "pointerdown"].forEach(function (ev) {
    addEventListener(ev, function () { if (betr.classList.contains("offen")) wach(); }, { passive: true });
  });

  function oeffnen(i) {
    betr.classList.add("offen"); leiste.hidden = false;
    document.body.style.overflow = "hidden";
    zeigen(i); wach();
  }
  function schliessen() {
    betr.classList.remove("offen"); leiste.hidden = true;
    document.body.style.overflow = "";
    setTimeout(function () { if (!betr.classList.contains("offen")) { bild.removeAttribute("src"); bild.style.opacity = 0; } }, 460);
  }

  document.getElementById("zu").onclick = schliessen;
  document.getElementById("weiter").onclick = function () { zeigen(index + 1); };
  document.getElementById("zurueck").onclick = function () { zeigen(index - 1); };

  addEventListener("keydown", function (e) {
    if (!betr.classList.contains("offen")) return;
    if (e.key === "Escape") schliessen();
    if (e.key === "ArrowRight") zeigen(index + 1);
    if (e.key === "ArrowLeft") zeigen(index - 1);
    if (e.key === "+" || e.key === "=") zielZoom(zz * 1.6, innerWidth / 2, innerHeight / 2);
    if (e.key === "-") zielZoom(zz / 1.6, innerWidth / 2, innerHeight / 2);
  });

  // mausrad / trackpad: stufenlos
  betr.addEventListener("wheel", function (e) {
    e.preventDefault();
    var d = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
    zielZoom(zz * Math.exp(-d * 0.0022), e.clientX, e.clientY);
    if (maus) folgen(e.clientX, e.clientY);
  }, { passive: false });

  betr.addEventListener("dblclick", function (e) {
    zielZoom(zz > 1.5 ? 1 : 4, e.clientX, e.clientY);
    if (maus) folgen(e.clientX, e.clientY);
  });

  // ziehen & zwei finger
  var zeiger = new Map(), start = null, bewegt = false;
  function neuStart() {
    var p = Array.from(zeiger.values());
    if (p.length === 1) start = { n: 1, px: p[0].x, py: p[0].y, x: zx, y: zy };
    else if (p.length >= 2) start = {
      n: 2, d: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y),
      mx: (p[0].x + p[1].x) / 2, my: (p[0].y + p[1].y) / 2, z: zz, x: zx, y: zy
    };
    else start = null;
  }
  betr.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "mouse") { bewegt = false; return; }
    betr.setPointerCapture(e.pointerId);
    zeiger.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (zeiger.size === 1) bewegt = false;
    z = zz; x = zx; y = zy; // laufende animation anhalten
    neuStart();
    betr.classList.add("ziehen");
  });
  betr.addEventListener("pointermove", function (e) {
    if (e.pointerType === "mouse" && !zeiger.size) {
      maus = { x: e.clientX, y: e.clientY };
      if (zz > 1.01) folgen(e.clientX, e.clientY);
      return;
    }
    if (!zeiger.has(e.pointerId) || !start) return;
    zeiger.set(e.pointerId, { x: e.clientX, y: e.clientY });
    var p = Array.from(zeiger.values());
    if (start.n === 1) {
      var dx = p[0].x - start.px, dy = p[0].y - start.py;
      if (Math.abs(dx) + Math.abs(dy) > 4) bewegt = true;
      sofort(zz, start.x + dx, start.y + dy);
    } else if (p.length >= 2) {
      bewegt = true;
      var d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      var mx = (p[0].x + p[1].x) / 2, my = (p[0].y + p[1].y) / 2;
      var nz = Math.max(MIN, Math.min(MAX, start.z * d / start.d));
      var ax = start.mx - innerWidth / 2, ay = start.my - innerHeight / 2;
      var bx = mx - innerWidth / 2, by = my - innerHeight / 2;
      sofort(nz, bx - (ax - start.x) * nz / start.z, by - (ay - start.y) * nz / start.z);
    }
  });
  function los(e) {
    if (e.pointerType === "mouse") {
      if (e.target === betr && zz <= 1.01) schliessen();
      return;
    }
    zeiger.delete(e.pointerId);
    if (zeiger.size === 0) {
      betr.classList.remove("ziehen");
      if (!bewegt && zz <= 1.01 && e.target === betr) schliessen();
    }
    neuStart();
  }
  betr.addEventListener("pointerup", los);
  betr.addEventListener("pointercancel", los);
  addEventListener("resize", function () { if (betr.classList.contains("offen") && bild.naturalWidth) einpassen(); });

  fetch("serien.json").then(function (r) { return r.json(); }).then(function (alle) {
    serie = alle.filter(function (s) { return s.id === id; })[0] || alle[0];
    id = serie.id;
    endung = serie.endung || "jpg";
    if (endung === "gif") document.body.classList.add("pixel");
    document.title = serie.titel + " · 2114112";
    document.getElementById("pfadname").textContent = serie.titel;
    document.getElementById("titel").textContent = serie.titel;
    var meta = document.getElementById("meta");
    if (serie.jahr) meta.append(serie.jahr);
    if (serie.link) {
      var a = document.createElement("a");
      a.href = serie.link; a.target = "_blank"; a.rel = "noopener"; a.textContent = "↗";
      meta.append(serie.jahr ? "  " : "", a);
    }
    if (serie.notiz) { var n = document.createElement("p"); n.textContent = serie.notiz; meta.appendChild(n); }

    var raster = document.getElementById("raster");
    serie.werke.forEach(function (e, i) {
      var w = typeof e === "string" ? { id: e, name: "" } : { id: e.id, name: e.titel || "" };
      werke.push(w);
      var b = document.createElement("button");
      b.innerHTML = '<div class="bild"><img loading="lazy" alt=""></div>';
      b.querySelector("img").src = "serien/" + id + (serie.klein === false ? "/" : "/klein/") + w.id + "." + endung;
      b.querySelector("img").alt = w.name || serie.titel;
      b.style.animationDelay = Math.min(i * 45, 900) + "ms";
      b.addEventListener("click", function () { oeffnen(i); });
      raster.appendChild(b);
    });
  });
})();
</script>
<script src="/bg.js"></script>
<script src="/schrift.js"></script>
<script src="/cursor.js"></script>
</body>
</html>
