<body>

<header>

</header>

<section id="zufall" aria-live="polite"></section>

<nav class="liste">
<a href="texts/004.html">004</a>
<br>
<a href="texts/003.html">003</a>
<br>
<a href="texts/002.html">002</a>
<br>

</nav>

<br><br>

<a href="/">current</a>

<script>
(function () {
  var texte = ["001", "002", "003", "004"];
  var ziel = document.getElementById("zufall");
  var letzter = null;

  function zeige() {
    var kandidaten = texte.filter(function (t) { return t !== letzter; });
    var nummer = kandidaten[Math.floor(Math.random() * kandidaten.length)];
    letzter = nummer;

    fetch("texts/" + nummer + ".html")
      .then(function (r) { return r.text(); })
      .then(function (html) {
        var doc = new DOMParser().parseFromString(html, "text/html");
        var absaetze = doc.querySelectorAll("main p");
        ziel.innerHTML = "";

        var kopf = document.createElement("div");
        kopf.className = "nummer";
        kopf.textContent = nummer;
        ziel.appendChild(kopf);

        absaetze.forEach(function (p) {
          ziel.appendChild(document.importNode(p, true));
        });

        var weiter = document.createElement("a");
        weiter.href = "#";
        weiter.className = "weiter";
        weiter.textContent = "anderer text";
        weiter.addEventListener("click", function (e) {
          e.preventDefault();
          zeige();
        });
        ziel.appendChild(weiter);
      })
      .catch(function () {
        ziel.textContent = "";
      });
  }

  zeige();
})();
</script>

</body>
