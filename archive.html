<body>

<header>

</header>

<section id="zufall" aria-live="polite"></section>

<nav class="steuerung">
<a href="#" id="zurueck" aria-label="zurück">⟲</a>
<a href="#" id="weiter" aria-label="neuer text">⟳</a>
</nav>

<noscript>
<p><a href="texts/001.html">001</a> · <a href="texts/002.html">002</a> · <a href="texts/003.html">003</a> · <a href="texts/004.html">004</a></p>
</noscript>

<br><br>

<a href="/">current</a>

<script>
(function () {
  var texte = ["001", "002", "003", "004"];
  var ziel = document.getElementById("zufall");
  var verlauf = [];
  var position = -1;

  function laden(nummer) {
    fetch("texts/" + nummer + ".html")
      .then(function (r) { return r.text(); })
      .then(function (html) {
        var doc = new DOMParser().parseFromString(html, "text/html");
        ziel.innerHTML = "";

        var kopf = document.createElement("div");
        kopf.className = "nummer";
        kopf.textContent = nummer;
        ziel.appendChild(kopf);

        doc.querySelectorAll("main p").forEach(function (p) {
          ziel.appendChild(document.importNode(p, true));
        });
      });
  }

  function neu() {
    var letzter = verlauf[verlauf.length - 1];
    var kandidaten = texte.filter(function (t) { return t !== letzter; });
    var nummer = kandidaten[Math.floor(Math.random() * kandidaten.length)];
    verlauf = verlauf.slice(0, position + 1);
    verlauf.push(nummer);
    position = verlauf.length - 1;
    laden(nummer);
  }

  function zurueck() {
    if (position > 0) {
      position -= 1;
      laden(verlauf[position]);
    }
  }

  document.getElementById("weiter").addEventListener("click", function (e) {
    e.preventDefault();
    neu();
  });
  document.getElementById("zurueck").addEventListener("click", function (e) {
    e.preventDefault();
    zurueck();
  });

  neu();
})();
</script>

</body>
