<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<title>galerie · 2114112</title>

<style>

body{
background:black;
color:white;
font-family:"Courier New", Courier, monospace;
margin:40px auto;
max-width:960px;
padding:20px;
line-height:1.7;
font-size:16px;
}

header{
margin-bottom:64px;
}

a{
color:white;
text-decoration:none;
}

a:hover{
opacity:0.6;
}

a:focus-visible{outline:1px dotted white;outline-offset:4px;}

.werk{
position:relative;
margin-bottom:96px;
cursor:none;
touch-action:pan-y;
}

.werk img{
width:100%;
height:auto;
display:block;
}

.werk span{
display:block;
font-size:14px;
opacity:0.7;
margin-top:8px;
}

.lupe{
position:absolute;
width:280px;
height:280px;
border-radius:50%;
pointer-events:none;
background-repeat:no-repeat;
background-color:black;
box-shadow:0 0 0 1px rgba(255,255,255,0.9),0 0 0 6px black,0 0 40px 10px rgba(0,0,0,0.8);
transform:translate(-50%,-50%) scale(0.6);
opacity:0;
transition:opacity 0.25s ease, transform 0.25s ease;
will-change:left,top,background-position;
}

.lupe.an{
opacity:1;
transform:translate(-50%,-50%) scale(1);
}

.lupe i{
position:absolute;
left:50%;
bottom:-28px;
transform:translateX(-50%);
font-style:normal;
font-size:12px;
opacity:0.7;
}

footer{
margin-top:64px;
font-size:14px;
opacity:0.7;
}

@media (max-width:600px){

body{
margin:18px;
padding:6px;

}

.lupe{

height:180px;
}

}

</style>

</head>

<body>

<header>
galerie
</header>

<main>
<figure class="werk"><img data-gross="bilder/gross/01.jpg" src="bilder/01.jpg" alt="visuelle arbeit 01"><span>01</span></figure>
<figure class="werk"><img data-gross="bilder/gross/02.jpg" src="bilder/02.jpg" alt="visuelle arbeit 02" loading="lazy"><span>02</span></figure>
<figure class="werk"><img data-gross="bilder/gross/03.jpg" src="bilder/03.jpg" alt="visuelle arbeit 03" loading="lazy"><span>03</span></figure>
<figure class="werk"><img data-gross="bilder/gross/04.jpg" src="bilder/04.jpg" alt="visuelle arbeit 04" loading="lazy"><span>04</span></figure>
</main>

<footer>
<a href="/">current</a>
</footer>

<script>
(function () {
  var MIN = 2, MAX = 8;

  document.querySelectorAll(".werk").forEach(function (werk) {
    var img = werk.querySelector("img");
    var lupe = document.createElement("div");
    lupe.className = "lupe";
    var anzeige = document.createElement("i");
    lupe.appendChild(anzeige);
    werk.appendChild(lupe);

    var zoom = 4;
    var ziel = { x: 0, y: 0 }, pos = { x: 0, y: 0 };
    var laeuft = false, sichtbar = false, geladen = false;

    function hochaufloesend() {
      if (geladen) return;
      geladen = true;
      lupe.style.backgroundImage = "url('" + img.currentSrc + "')";
      var gross = new Image();
      gross.onload = function () { lupe.style.backgroundImage = "url('" + gross.src + "')"; };
      gross.src = img.dataset.gross;
    }

    function zeichnen() {
      pos.x += (ziel.x - pos.x) * 0.25;
      pos.y += (ziel.y - pos.y) * 0.25;
      var r = img.getBoundingClientRect();
      var w = lupe.offsetWidth;
      lupe.style.left = pos.x + "px";
      lupe.style.top = pos.y + "px";
      lupe.style.backgroundSize = (r.width * zoom) + "px " + (r.height * zoom) + "px";
      lupe.style.backgroundPosition =
        (w / 2 - pos.x * zoom) + "px " + (w / 2 - pos.y * zoom) + "px";
      anzeige.textContent = "×" + zoom;
      if (sichtbar || Math.abs(ziel.x - pos.x) > 0.3 || Math.abs(ziel.y - pos.y) > 0.3) {
        requestAnimationFrame(zeichnen);
      } else {
        laeuft = false;
      }
    }

    function bewegen(cx, cy) {
      var r = img.getBoundingClientRect();
      var x = cx - r.left, y = cy - r.top;
      if (x < 0 || y < 0 || x > r.width || y > r.height) { aus(); return; }
      hochaufloesend();
      if (!sichtbar) { pos.x = x; pos.y = y; }
      ziel.x = x; ziel.y = y;
      sichtbar = true;
      lupe.classList.add("an");
      if (!laeuft) { laeuft = true; requestAnimationFrame(zeichnen); }
    }

    function aus() {
      sichtbar = false;
      lupe.classList.remove("an");
    }

    werk.addEventListener("mousemove", function (e) { bewegen(e.clientX, e.clientY); });
    werk.addEventListener("mouseleave", aus);

    // mausrad: vergrößerung ändern
    werk.addEventListener("wheel", function (e) {
      if (!sichtbar) return;
      e.preventDefault();
      zoom = Math.max(MIN, Math.min(MAX, zoom + (e.deltaY < 0 ? 1 : -1)));
      if (!laeuft) { laeuft = true; requestAnimationFrame(zeichnen); }
    }, { passive: false });

    // touch: kurz halten, dann fahren
    var halten = null, aktiv = false;
    werk.addEventListener("touchstart", function (e) {
      var t = e.touches[0];
      halten = setTimeout(function () { aktiv = true; bewegen(t.clientX, t.clientY - 90); }, 250);
    }, { passive: true });
    werk.addEventListener("touchmove", function (e) {
      if (!aktiv) { clearTimeout(halten); return; }
      e.preventDefault();
      // lupe etwas über dem finger, damit er sie nicht verdeckt
      bewegen(e.touches[0].clientX, e.touches[0].clientY - 90);
    }, { passive: false });
    werk.addEventListener("touchend", function () {
      clearTimeout(halten); aktiv = false; aus();
    });
  });
})();
</script>

</body>
</html>
