<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>galerie · 2114112</title>

<style>

body{
background:black;
color:white;
font-family:"Courier New", Courier, monospace;
margin:40px auto;
max-width:960px;
padding:20px;
line-height:1.7;
font-size:16px;
}

header{
margin-bottom:64px;
}

a{
color:white;
text-decoration:none;
}

a:hover{
opacity:0.6;
}

a:focus-visible{outline:1px dotted white;outline-offset:4px;}

/* serien-index */

.index{
display:flex;
flex-wrap:wrap;
gap:8px 32px;
font-size:14px;
margin-bottom:96px;
}

.index a span{
opacity:0.5;
}

/* serie */

.serie{
margin-bottom:160px;
}

.serie-kopf{
display:flex;
justify-content:space-between;
align-items:baseline;
border-top:1px solid rgba(255,255,255,0.3);
padding-top:16px;
margin-bottom:48px;
font-size:14px;
}

.serie-kopf h2{
font-size:16px;
font-weight:normal;
margin:0;
letter-spacing:2px;
}

.serie-kopf .meta{
opacity:0.5;
}

.serie-notiz{
max-width:560px;
margin:-24px 0 48px;
opacity:0.8;
}

/* werk */

.werk{
position:relative;
margin:0 0 96px;
cursor:none;
touch-action:pan-y;
}

.werk img{
width:100%;
height:auto;
display:block;
transition:opacity 0.4s ease;
}

.werk.fokus img{
opacity:0.25;
}

.werk figcaption{
display:flex;
justify-content:space-between;
font-size:12px;
opacity:0.5;
margin-top:8px;
}

/* lupe */

.lupe{
position:absolute;
width:300px;
height:300px;
border-radius:50%;
pointer-events:none;
background-repeat:no-repeat;
background-color:black;
outline:1px solid white;
outline-offset:6px;
transform:translate(-50%,-50%) scale(0.85);
opacity:0;
transition:opacity 0.3s ease, transform 0.3s ease;
will-change:left,top,background-position;
}

.lupe.an{
opacity:1;
transform:translate(-50%,-50%) scale(1);
}

/* fadenkreuz-punkt */
.lupe::after{
content:"";
position:absolute;
left:50%;
top:50%;
width:3px;
height:3px;
margin:-1.5px 0 0 -1.5px;
background:white;
mix-blend-mode:difference;
}

.lupe i{
position:absolute;
left:50%;
top:calc(100% + 16px);
transform:translateX(-50%);
font-style:normal;
font-size:11px;
letter-spacing:2px;
white-space:nowrap;
}

footer{
margin-top:64px;
font-size:14px;
opacity:0.7;
}

@media (max-width:600px){

body{
margin:18px;
padding:6px;
font-size:18px;
}

.lupe{
width:200px;
height:200px;
}

}

@media (hover:none){
.werk{cursor:auto;}
}

</style>

</head>

<body>

<header>
galerie
</header>

<nav class="index" id="index"></nav>

<main id="serien"></main>

<footer>
<a href="/">current</a>
</footer>

<script>
(function () {
  var MIN = 2, MAX = 9;

  function lupe(werk) {
    var img = werk.querySelector("img");
    var l = document.createElement("div");
    l.className = "lupe";
    var anzeige = document.createElement("i");
    l.appendChild(anzeige);
    werk.appendChild(l);

    var zoom = 4, ziel = { x: 0, y: 0 }, pos = { x: 0, y: 0 };
    var laeuft = false, sichtbar = false, geladen = false;

    function hochaufloesend() {
      if (geladen) return;
      geladen = true;
      l.style.backgroundImage = "url('" + img.currentSrc + "')";
      var g = new Image();
      g.onload = function () { l.style.backgroundImage = "url('" + g.src + "')"; };
      g.src = img.dataset.gross;
    }

    function zeichnen() {
      pos.x += (ziel.x - pos.x) * 0.22;
      pos.y += (ziel.y - pos.y) * 0.22;
      var r = img.getBoundingClientRect(), w = l.offsetWidth;
      l.style.left = pos.x + "px";
      l.style.top = pos.y + "px";
      l.style.backgroundSize = (r.width * zoom) + "px " + (r.height * zoom) + "px";
      l.style.backgroundPosition = (w / 2 - pos.x * zoom) + "px " + (w / 2 - pos.y * zoom) + "px";
      anzeige.textContent = "×" + zoom;
      if (sichtbar || Math.abs(ziel.x - pos.x) > 0.3 || Math.abs(ziel.y - pos.y) > 0.3) {
        requestAnimationFrame(zeichnen);
      } else { laeuft = false; }
    }

    function bewegen(cx, cy) {
      var r = img.getBoundingClientRect(), x = cx - r.left, y = cy - r.top;
      if (x < 0 || y < 0 || x > r.width || y > r.height) { aus(); return; }
      hochaufloesend();
      if (!sichtbar) { pos.x = x; pos.y = y; }
      ziel.x = x; ziel.y = y;
      sichtbar = true;
      l.classList.add("an");
      werk.classList.add("fokus");
      if (!laeuft) { laeuft = true; requestAnimationFrame(zeichnen); }
    }

    function aus() {
      sichtbar = false;
      l.classList.remove("an");
      werk.classList.remove("fokus");
    }

    werk.addEventListener("mousemove", function (e) { bewegen(e.clientX, e.clientY); });
    werk.addEventListener("mouseleave", aus);
    werk.addEventListener("wheel", function (e) {
      if (!sichtbar) return;
      e.preventDefault();
      zoom = Math.max(MIN, Math.min(MAX, zoom + (e.deltaY < 0 ? 1 : -1)));
      if (!laeuft) { laeuft = true; requestAnimationFrame(zeichnen); }
    }, { passive: false });

    var halten = null, aktiv = false;
    werk.addEventListener("touchstart", function (e) {
      var t = e.touches[0];
      halten = setTimeout(function () { aktiv = true; bewegen(t.clientX, t.clientY - 110); }, 250);
    }, { passive: true });
    werk.addEventListener("touchmove", function (e) {
      if (!aktiv) { clearTimeout(halten); return; }
      e.preventDefault();
      bewegen(e.touches[0].clientX, e.touches[0].clientY - 110);
    }, { passive: false });
    werk.addEventListener("touchend", function () { clearTimeout(halten); aktiv = false; aus(); });
  }

  fetch("serien.json")
    .then(function (r) { return r.json(); })
    .then(function (serien) {
      var index = document.getElementById("index");
      var main = document.getElementById("serien");

      serien.forEach(function (s) {
        var a = document.createElement("a");
        a.href = "#serie-" + s.id;
        a.innerHTML = s.titel + " <span>" + s.werke.length + "</span>";
        index.appendChild(a);

        var sec = document.createElement("section");
        sec.className = "serie";
        sec.id = "serie-" + s.id;

        var kopf = document.createElement("div");
        kopf.className = "serie-kopf";
        var h = document.createElement("h2");
        h.textContent = s.titel;
        var meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = [s.jahr, s.werke.length + " arbeiten"].filter(Boolean).join(" · ");
        kopf.appendChild(h); kopf.appendChild(meta);
        sec.appendChild(kopf);

        if (s.notiz) {
          var n = document.createElement("p");
          n.className = "serie-notiz";
          n.textContent = s.notiz;
          sec.appendChild(n);
        }

        s.werke.forEach(function (w, i) {
          var fig = document.createElement("figure");
          fig.className = "werk";
          var img = document.createElement("img");
          img.src = "serien/" + s.id + "/" + w + ".jpg";
          img.dataset.gross = "serien/" + s.id + "/gross/" + w + ".jpg";
          img.alt = s.titel + ", " + w;
          img.loading = "lazy";
          var cap = document.createElement("figcaption");
          cap.innerHTML = "<span>" + w + "</span><span>" + (i + 1) + " / " + s.werke.length + "</span>";
          fig.appendChild(img); fig.appendChild(cap);
          sec.appendChild(fig);
          lupe(fig);
        });

        main.appendChild(sec);
      });
    });
})();
</script>

</body>
</html>
